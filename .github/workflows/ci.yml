name: CI Pipeline
on:
  push:
    paths:
      - app/**
      - tests/**
      - '*.py'
      - 'Makefile'
      - 'entrypoint.sh'
      - '.github/workflows/ci.yml'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
  workflow_dispatch:
jobs:
  build-test-lint:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.14' 
      - name: Build Docker containers
        run: |
          make docker-compose-up
      - name: Run tests
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL }}
        run: |
          make test
      - name: Run linter
        run: | 
          make lint
  login-and-push:
    runs-on: self-hosted
    needs: build-test-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: docker login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build and push Docker image
        run: |
          docker build -t student-api:v1.0.0 .
          docker tag student-api:v1.0.0 ${{ secrets.DOCKER_USERNAME }}/student-api:v1.0.0
          docker push ${{ secrets.DOCKER_USERNAME }}/student-api:v1.0.0