services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - python-app-api-1
      - python-app-api-2
    networks:
      - student-network
  python-app-api-1:
    build: .
    container_name: api1
    expose:
      - "5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/students_db
    networks:
      - student-network
    depends_on:
      - migrate
  python-app-api-2:
    build: .
    container_name: api2
    expose:
      - "5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/students_db
    networks:
      - student-network
    depends_on:
      - migrate
  migrate:
    build: .
    container_name: migrate
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/students_db
    command: >
      sh -c "until python3 -c 'import socket; s=socket.create_connection((\"db\", 5432), timeout=1)' 2>/dev/null; do sleep 1; done; flask db upgrade"
    depends_on:
      - db
    networks:
      - student-network
    restart: "no"
  db:
    image: postgres:latest
    container_name: db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=students_db
    ports:
      - "5432:5432"
    networks:
      - student-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  student-network:
    driver: bridge
volumes:
  db-data: