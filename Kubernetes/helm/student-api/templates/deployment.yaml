apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.db.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.db.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.db.name }}
    spec:
      nodeSelector:
      {{- toYaml .Values.db.nodeSelector | nindent 8 }}
      containers:
      - name: {{ .Values.db.name }}
        image: {{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}
        ports:
        - containerPort: {{ .Values.db.port }}
        envFrom:
        - configMapRef:
            name: postgres-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.externalSecret.secretName }}
              key: POSTGRES_PASSWORD
        resources: {{ toYaml .Values.db.resources | nindent 10 }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-api-deployment
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
    spec:
      nodeSelector:
      {{- toYaml .Values.app.nodeSelector | nindent 8 }}
      initContainers:
      - name: migrate-db
        image: {{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}
        workingDir: /
        command:
        - sh
        - -c
        - |
          until python3 -c "import socket; s=socket.create_connection(('postgres-service', 5432), timeout=1)" 2>/dev/null; do
            echo 'Waiting for postgres...'
            sleep 1
          done
          echo 'Postgres is ready!'
          flask db upgrade
        envFrom:
        - configMapRef:
            name: student-api-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.externalSecret.secretName }}
              key: POSTGRES_PASSWORD
        - name: DATABASE_URL
          value: "postgresql://$(DB_USER):$(POSTGRES_PASSWORD)@postgres-service:$(DB_PORT)/$(DB_NAME)"
      containers:
      - name: {{ .Values.app.name }}
        image: {{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}
        ports:
        - containerPort: {{ .Values.app.port }}
        envFrom:
        - configMapRef:
            name: student-api-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.externalSecret.secretName }}
              key: POSTGRES_PASSWORD
        - name: DATABASE_URL
          value: "postgresql://$(DB_USER):$(POSTGRES_PASSWORD)@postgres-service:$(DB_PORT)/$(DB_NAME)"
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: {{ .Values.app.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
          successThreshold: 1
        resources: {{ toYaml .Values.app.resources | nindent 10 }}