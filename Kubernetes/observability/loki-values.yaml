loki:
  nodeSelector:
    type: dependent_services

  commonConfig:
    replication_factor: 1       # single instance, fine for dev

  storage:
    type: filesystem            # store logs on local disk, not S3
  
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h 
  
  auth_enabled: false           # no authentication needed for dev

deploymentMode: SingleBinary    # run everything in one pod, simpler for dev

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0