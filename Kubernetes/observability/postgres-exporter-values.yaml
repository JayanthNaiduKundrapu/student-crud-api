config:
  datasource:
    host: postgres-service.student-api.svc.cluster.local
    port: "5432"
    user: postgres
    password: postgres
    database: students_db
    sslmode: disable

service:
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"

serviceMonitor:
  enabled: true

nodeSelector:
  type: dependent_services