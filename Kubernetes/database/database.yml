apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: student-api
data:
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "students_db"  

# ---
# We will use Vault to manage the database password, so we won't hardcode it here.
#apiVersion: v1
#kind: Secret
#metadata:
#  name: postgres-secret
#  namespace: student-api
#type: Opaque
#stringData:
#  POSTGRES_PASSWORD: "postgres"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: student-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        type: database
      containers:
      - name: postgres
        image: postgres:latest
        ports:
        - containerPort: 5432
        envFrom:
        - configMapRef:
            name: postgres-config
        - secretRef:
            name: postgres-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1"

---

apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: student-api
spec:
  selector:
    app: postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
  type: ClusterIP
